name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tests, reproduced numbers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      # The exact versions that produced reports/. Installing lower bounds would
      # let the numbers drift without warning, and the last step of this workflow
      # compares them against the committed reports.
      - name: Install
        run: pip install -r requirements-lock.txt

      - name: Lint
        run: |
          ruff check src scripts tests app
          ruff format --check src scripts tests app

      - name: Tests
        run: pytest tests/

      # Both reports are replayed and confronted with the committed ones. If a
      # code change moves a number the README publishes, CI fails here rather
      # than letting the documentation lie in silence.
      - name: Published numbers are reproduced exactly
        run: |
          cp reports/benchmark.json /tmp/published-benchmark.json
          cp reports/experiments.json /tmp/published-experiments.json
          python scripts/benchmark.py --output reports/benchmark.json
          python scripts/experiments.py --output reports/experiments.json
          python - <<'PY'
          import json, sys

          CHECKED = {
              "benchmark": (
                  "/tmp/published-benchmark.json",
                  "reports/benchmark.json",
                  ("baselines", "baselines_random", "supervised", "supervised_random",
                   "supervised_leaky", "duplicates", "splits"),
              ),
              "experiments": (
                  "/tmp/published-experiments.json",
                  "reports/experiments.json",
                  ("one_class", "one_class_random_split", "duplicates", "splits"),
              ),
          }

          def numbers(node, trail=""):
              if isinstance(node, dict):
                  for key, value in node.items():
                      yield from numbers(value, f"{trail}.{key}" if trail else key)
              elif isinstance(node, (int, float)) and not isinstance(node, bool):
                  yield trail, node

          drift = []
          for name, (before, after, sections) in CHECKED.items():
              published = json.load(open(before))
              fresh = json.load(open(after))
              for section in sections:
                  reference = dict(numbers(published.get(section, {})))
                  current = dict(numbers(fresh.get(section, {})))
                  for path, value in reference.items():
                      now = current.get(path)
                      if now is None or abs(now - value) > 1e-6:
                          drift.append(f"{name}.{section}.{path}: {value} -> {now}")

          if drift:
              print("Published numbers have moved:")
              print("\n".join("  " + line for line in drift))
              sys.exit(1)
          print("Every published number is reproduced identically.")
          PY

      # A figure that contradicts the reports is the failure this project
      # already had once, when plots committed before a labelling fix kept
      # showing the old story. Redrawing them in CI proves the script still runs
      # against the current reports.
      - name: Figures redraw from the reports
        run: python scripts/figures.py --reports reports --output /tmp/assets
