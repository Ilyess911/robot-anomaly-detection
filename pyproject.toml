[project]
name = "robot-anomaly-detection"
version = "1.1.0"
description = "Anomaly detection on industrial robot executions from force and torque sensors."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# Le sous-ensemble utile sur un projet de ce genre. Pas de règle de style pure :
# une règle qu'on désactive au premier désaccord n'a jamais servi à rien.
select = [
  "E",      # erreurs pycodestyle
  "F",      # pyflakes : imports morts, variables inutilisées, f-strings vides
  "I",      # ordre des imports
  "UP",     # syntaxe moderne
  "B",      # pièges courants (bugbear)
  "RUF",    # règles propres à ruff
  "FURB",   # tournures obsolètes
]

ignore = [
  # Ces trois règles signalent les guillemets typographiques et les caractères
  # accentués comme « ambigus ». Une partie de la documentation de ce dépôt est
  # en français : les corriger reviendrait à écrire du mauvais français pour
  # satisfaire un détecteur d'homoglyphes.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Le package réexporte volontairement : ces imports servent d'API publique.
"src/__init__.py" = ["F401"]
# Les tests importent à l'intérieur des fonctions pour garder le coût des
# imports lourds dans le seul test qui en a besoin.
"tests/*" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
