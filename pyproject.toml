[project]
name = "robot-anomaly-detection"
version = "2.0.0"
description = "An anomaly detection framework for robotic and industrial systems, evaluated on multivariate force and torque data."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests", "app"]

[tool.ruff.lint]
# The useful subset for a project of this kind. No pure style rule: a rule
# switched off at the first disagreement was never worth having.
select = [
  "E",      # pycodestyle errors
  "F",      # pyflakes: dead imports, unused variables, empty f-strings
  "I",      # import order
  "UP",     # modern syntax
  "B",      # common traps (bugbear)
  "RUF",    # ruff's own rules
  "FURB",   # outdated constructs
]

ignore = [
  # These three flag typographic quotes and accented characters as ambiguous.
  # Some documentation and commit prose here is in French, and satisfying a
  # homoglyph detector would mean writing bad French.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# The package re-exports on purpose: these imports are the public API.
"src/__init__.py" = ["F401"]
"src/utils.py" = ["F401"]
"src/data/__init__.py" = ["F401"]
"src/features/__init__.py" = ["F401"]
"src/models/__init__.py" = ["F401"]
"src/evaluation/__init__.py" = ["F401"]
"src/visualization/__init__.py" = ["F401"]
# The tests import inside functions to keep the cost of heavy imports in the
# single test that needs them.
"tests/*" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# The repository root has to be on sys.path for `src` and `scripts` to be
# importable. Without this line, collection succeeds on a machine where the root
# is already there for another reason and fails in CI on ModuleNotFoundError,
# which is exactly the "works on my machine" that continuous integration exists
# to catch.
pythonpath = ["."]
